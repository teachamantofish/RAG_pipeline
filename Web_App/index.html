
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAG Workflow Configuration</title>
  <!-- Shoelace CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.11.0/cdn/themes/light.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.11.0/cdn/themes/dark.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/config-form.css">
  <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.11.0/cdn/shoelace.js"></script>
  <script type="module" src="./vite/src/main.ts"></script> <!-- or .js -->
  <script type="module">
    const initThemeToggle = () => {
      const toggle = document.getElementById('theme-toggle');
      if (!toggle) return;

      // Optional: start in light mode
      document.body.classList.remove('sl-theme-dark');

      toggle.addEventListener('sl-change', e => {
        const isDark = e.target.checked;
        document.body.classList.toggle('sl-theme-dark', isDark);
      });
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initThemeToggle, { once: true });
    } else {
      initThemeToggle();
    }
  </script>
</head>
<body>
  <header class="header">
    <div class="header-title">RAG Workflow Configuration</div>
    <div class="header-xyz"></div>
    <sl-switch id="theme-toggle" class="theme-toggle" checked>Light/Dark</sl-switch>
  </header>

  <main class="main">    
    <sl-tab-group id="workflow-tabs">
      <sl-tab slot="nav" panel="source">Run Settings</sl-tab>
      <sl-tab slot="nav" panel="crawl">Crawl Web</sl-tab>
      <sl-tab slot="nav" panel="crawl_pdf">Crawl PDF</sl-tab>
      <sl-tab slot="nav" panel="clean">Clean</sl-tab>
      <sl-tab slot="nav" panel="chunk">Chunk</sl-tab>
      <sl-tab slot="nav" panel="summary">Summarize</sl-tab>
      <sl-tab slot="nav" panel="training_data">Training Data</sl-tab>
      <sl-tab slot="nav" panel="embed">Embed</sl-tab>
      <sl-tab slot="nav" panel="vector">Upsert to DB</sl-tab>
      <sl-tab-panel name="source">
        <section id="tab-content-source"></section>
      </sl-tab-panel>
      <sl-tab-panel name="crawl">
        <section id="tab-content-crawl"></section>
      </sl-tab-panel>
        <sl-tab-panel name="crawl_pdf">
          <section id="tab-content-crawl_pdf"></section>
        </sl-tab-panel>
      <sl-tab-panel name="clean">
        <section id="tab-content-clean"></section>
      </sl-tab-panel>
      <sl-tab-panel name="chunk">
        <section id="tab-content-chunk"></section>
      </sl-tab-panel>
      <sl-tab-panel name="summary">
        <section id="tab-content-summary"></section>
      </sl-tab-panel>
      <sl-tab-panel name="training_data">
        <section id="tab-content-training_data"></section>
      </sl-tab-panel>
      <sl-tab-panel name="embed">
        <section id="tab-content-embed"></section>
      </sl-tab-panel>
      <sl-tab-panel name="vector">
        <section id="tab-content-vector"></section>
      </sl-tab-panel>
    </sl-tab-group>
  <!-- Shared help dialog (used by all config tabs) -->
  <sl-dialog id="help-dialog" label="Help">
    <div id="help-dialog-body" class="help-dialog-body"></div>
  </sl-dialog>
</main>
</body>
<script>
// Tab registry: HTML fragment, init module, and the init function it exports.
const tabs = {
  source: { file: 'source.html', module: './js/source/source-init.js', init: 'initSourceTab' },
  crawl: { file: 'crawl.html', module: './js/crawl/crawl-init.js', init: 'initCrawlTab' },
  crawl_pdf: { file: 'crawl_pdf.html', module: './js/crawl-pdf/crawl-pdf-init.js', init: 'initCrawlPdfTab' },
  clean: { file: 'clean.html', module: './js/clean/clean-init.js', init: 'initCleanTab' },
  chunk: { file: 'chunk.html', module: './js/chunk/chunk-init.js', init: 'initChunkTab' },
  summary: { file: 'summary.html', module: './js/summary/summary-init.js', init: 'initSummaryTab' },
  training_data: { file: 'training_data.html' },
  embed: { file: 'embed.html', module: './js/embed/embed-init.js', init: 'initEmbedTab' },
  vector: { file: 'vector.html', module: './js/vector/vector-init.js', init: 'initVectorTab' },
};

function loadTab(tab) {
  const entry = tabs[tab];
  const section = document.getElementById(`tab-content-${tab}`);
  if (!entry || !section) return;

  // Load each fragment once
  if (section.dataset.loaded) return;
  section.dataset.loaded = 'true';

  fetch(entry.file)
    .then(response => {
      if (!response.ok) throw new Error(`Failed to fetch ${entry.file}: ${response.status}`);
      return response.text();
    })
    .then(html => {
      const looksLikeDocument = /<!doctype/i.test(html) || /<html[\s>]/i.test(html);
      if (looksLikeDocument) {
        console.error(`Expected fragment but received full document from ${entry.file}. Check dev server settings or path.`);
        section.innerHTML = `<div style="color:#c00">Unexpected document response from ${entry.file}. Check the dev server configuration.</div>`;
        return;
      }
      section.innerHTML = html;

      if (!entry.module) return;
      return import(entry.module).then(mod => mod[entry.init](section));
    })
    .catch(err => {
      console.error(`[index] Failed to load ${tab} tab:`, err);
      delete section.dataset.loaded; // allow a retry on the next tab show
      section.innerHTML = `<div style="color:#c00">Error loading ${entry.file}: ${err.message}</div>`;
    });
}

// Listen for Shoelace tab change events
const workflowTabs = document.getElementById('workflow-tabs');

const handleTabChange = event => {
  const detail = event.detail || {};
  const tab = detail.name || (workflowTabs.activeTab && workflowTabs.activeTab.panel);
  if (!tab) {
    console.warn('[WARN] Unable to resolve tab name from event', event);
    return;
  }
  loadTab(tab);
};

if (workflowTabs) {
  workflowTabs.addEventListener('sl-tab-show', handleTabChange);
}

// Load the first tab by default, and preload Crawl
loadTab('source');
loadTab('crawl');
</script>
</html>
