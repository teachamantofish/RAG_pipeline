<section>
  <form id="clean-form">
    <div class="config-form-container">
      <div class="config-form-column config-form-column--controls">
        <div class="config-form-panel-label">Clean configuration</div>
        <div class="config-action-buttons">
          <sl-button variant="primary" id="clean-save-btn"><sl-icon name="floppy"></sl-icon></sl-button>
          <sl-button variant="primary" id="clean-reload-btn"><sl-icon name="trash"></sl-icon></sl-button>
          <sl-button variant="primary" id="clean-run-btn"><sl-icon name="play-fill"></sl-icon></sl-button>
          <sl-button variant="primary" id="clean-stop-btn" disabled><sl-icon name="stop-fill"></sl-icon></sl-button>
        </div>
        <div class="config-field"><sl-radio-group id="clean-enable_structure_fixes" data-config-key="ENABLE_STRUCTURE_FIXES" size="small" label="Structure Fixes" name="clean_enable_structure_fixes" value="true"><sl-radio value="true">True</sl-radio><sl-radio value="false">False</sl-radio></sl-radio-group></div>
        <div class="config-field"><sl-radio-group id="clean-enable_heading_normalization" data-config-key="ENABLE_HEADING_NORMALIZATION" size="small" label="Heading Normalization" name="clean_enable_heading_normalization" value="true"><sl-radio value="true">True</sl-radio><sl-radio value="false">False</sl-radio></sl-radio-group></div>
        <div class="config-field"><sl-radio-group id="clean-enable_link_fixes" data-config-key="ENABLE_LINK_FIXES" size="small" label="Link Fixes" name="clean_enable_link_fixes" value="true"><sl-radio value="true">True</sl-radio><sl-radio value="false">False</sl-radio></sl-radio-group></div>
        <div class="config-field"><sl-radio-group id="clean-enable_code_fence_fixes" data-config-key="ENABLE_CODE_FENCE_FIXES" size="small" label="Code Fence Fixes" name="clean_enable_code_fence_fixes" value="true"><sl-radio value="true">True</sl-radio><sl-radio value="false">False</sl-radio></sl-radio-group></div>
        <div class="config-field"><sl-radio-group id="clean-enable_table_repair" data-config-key="ENABLE_TABLE_REPAIR" size="small" label="Table Repair" name="clean_enable_table_repair" value="true"><sl-radio value="true">True</sl-radio><sl-radio value="false">False</sl-radio></sl-radio-group></div>
        <div class="config-field"><sl-radio-group id="clean-enable_list_normalization" data-config-key="ENABLE_LIST_NORMALIZATION" size="small" label="List Normalization" name="clean_enable_list_normalization" value="true"><sl-radio value="true">True</sl-radio><sl-radio value="false">False</sl-radio></sl-radio-group></div>
        <div class="config-field"><sl-radio-group id="clean-enable_custom_regex" data-config-key="ENABLE_CUSTOM_REGEX" size="small" label="Custom Regex Cleanup" name="clean_enable_custom_regex" value="true"><sl-radio value="true">True</sl-radio><sl-radio value="false">False</sl-radio></sl-radio-group></div>
        <sl-textarea id="clean-status-display" class="config-status-display" label="Notes" placeholder="Configuration notes will appear here" readonly resize="none" rows="3"></sl-textarea>
      </div>
      <div class="config-form-column config-form-column--viewer">
        <div class="config-form-panel-label">File reader</div>
        <div class="fields"><sl-textarea id="clean-config-viewer" class="config-file-viewer" resize="auto" placeholder="Loading file..."></sl-textarea></div>
      </div>
    </div>
  </form>
</section>
