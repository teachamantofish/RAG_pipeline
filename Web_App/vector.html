<section>
  <form id="vector-form">
    <div class="config-form-container">
      <div class="config-form-column config-form-column--controls">
        <div class="config-form-panel-label">Upsert to DB configuration</div>
        <div class="config-action-buttons">
          <sl-button variant="primary" id="vector-save-btn"><sl-icon name="floppy"></sl-icon></sl-button>
          <sl-button variant="primary" id="vector-reload-btn"><sl-icon name="trash"></sl-icon></sl-button>
          <sl-button variant="primary" id="vector-run-btn"><sl-icon name="play-fill"></sl-icon></sl-button>
          <sl-button variant="primary" id="vector-stop-btn" disabled><sl-icon name="stop-fill"></sl-icon></sl-button>
        </div>
        <div class="config-field"><sl-input id="vector-vector_db_name" data-config-key="VECTOR_DB_NAME" label="Database Name" type="text"></sl-input></div>
        <div class="config-field"><sl-input id="vector-vector_db_user" data-config-key="VECTOR_DB_USER" label="Database User" type="text"></sl-input></div>
        <div class="config-field"><sl-input id="vector-vector_db_password" data-config-key="VECTOR_DB_PASSWORD" label="Database Password" type="text"></sl-input></div>
        <div class="config-field"><sl-input id="vector-vector_db_host" data-config-key="VECTOR_DB_HOST" label="Database Host" type="text"></sl-input></div>
        <div class="config-field"><sl-input id="vector-vector_db_port" data-config-key="VECTOR_DB_PORT" label="Database Port" type="text"></sl-input></div>
        <div class="config-field"><sl-input id="vector-batch_size" data-config-key="BATCH_SIZE" label="Batch Size" type="number" min="1"></sl-input></div>
        <div class="config-field"><sl-select id="vector-log_level" data-config-key="LOG_LEVEL" label="Log Level"><sl-option value="DEBUG">DEBUG</sl-option><sl-option value="INFO">INFO</sl-option><sl-option value="WARNING">WARNING</sl-option><sl-option value="ERROR">ERROR</sl-option><sl-option value="CRITICAL">CRITICAL</sl-option></sl-select></div>
        <div class="config-field"><sl-input id="vector-chunks_file_name" data-config-key="CHUNKS_FILE_NAME" label="Chunks File Name" type="text"></sl-input></div>
        <div class="config-field"><sl-input id="vector-parquet_filename" data-config-key="PARQUET_FILENAME" label="Parquet Filename" type="text"></sl-input></div>
        <div class="config-field"><sl-input id="vector-db_table_name" data-config-key="DB_TABLE_NAME" label="DB Table Name" type="text"></sl-input></div>
        <sl-textarea id="vector-status-display" class="config-status-display" label="Notes" placeholder="Configuration notes will appear here" readonly resize="none" rows="3"></sl-textarea>
      </div>
      <div class="config-form-column config-form-column--viewer">
        <div class="config-form-panel-label">File reader</div>
        <div class="fields"><sl-textarea id="vector-config-viewer" class="config-file-viewer" resize="auto" placeholder="Loading file..."></sl-textarea></div>
      </div>
    </div>
  </form>
</section>
