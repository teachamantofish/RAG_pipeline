<section>
  <form id="embed-form">
    <div class="config-form-container">
      <div class="config-form-column config-form-column--controls">
        <div class="config-form-panel-label">Embed configuration</div>
        <div class="config-action-buttons">
          <sl-button variant="primary" id="embed-save-btn"><sl-icon name="floppy"></sl-icon></sl-button>
          <sl-button variant="primary" id="embed-reload-btn"><sl-icon name="trash"></sl-icon></sl-button>
          <sl-button variant="primary" id="embed-run-btn"><sl-icon name="play-fill"></sl-icon></sl-button>
          <sl-button variant="primary" id="embed-stop-btn" disabled><sl-icon name="stop-fill"></sl-icon></sl-button>
        </div>
        <div class="config-field"><sl-radio-group id="embed-enable_embedding" data-config-key="ENABLE_EMBEDDING" size="small" label="Enable Embedding" name="embed_enable_embedding" value="true"><sl-radio value="true">True</sl-radio><sl-radio value="false">False</sl-radio></sl-radio-group></div>
        <div class="config-field"><sl-input id="embed-embed_model" data-config-key="EMBED_MODEL" label="Embed Model" type="text"></sl-input></div>
        <div class="config-field"><sl-input id="embed-adapter_path" data-config-key="ADAPTER_PATH" label="Adapter Path" type="text"></sl-input></div>
        <div class="config-field"><sl-select id="embed-embed_log_level" data-config-key="EMBED_LOG_LEVEL" label="Embed Log Level"><sl-option value="DEBUG">DEBUG</sl-option><sl-option value="INFO">INFO</sl-option><sl-option value="WARNING">WARNING</sl-option><sl-option value="ERROR">ERROR</sl-option></sl-select></div>
        <div class="section-divider"><hr><span>Precision Controls</span><hr></div>
        <div class="config-field"><sl-select id="embed-embed_compute_precision" data-config-key="EMBED_COMPUTE_PRECISION" label="Compute Precision"><sl-option value="float32">float32</sl-option><sl-option value="float16">float16</sl-option><sl-option value="bfloat16">bfloat16</sl-option><sl-option value="tf32">tf32</sl-option></sl-select></div>
        <div class="config-field"><sl-select id="embed-embed_output_precision" data-config-key="EMBED_OUTPUT_PRECISION" label="Output Precision"><sl-option value="float32">float32</sl-option><sl-option value="float16">float16</sl-option><sl-option value="bfloat16">bfloat16</sl-option></sl-select></div>
        <div class="config-field"><sl-radio-group id="embed-enable_tf32" data-config-key="ENABLE_TF32" size="small" label="Enable TF32" name="embed_enable_tf32" value="true"><sl-radio value="true">True</sl-radio><sl-radio value="false">False</sl-radio></sl-radio-group></div>
        <div class="config-field"><sl-input id="embed-embed_vector_dim" data-config-key="EMBED_VECTOR_DIM" label="Embedding Dimension" type="number" min="1"></sl-input></div>
        <div class="config-field"><sl-radio-group id="embed-enforce_embed_vector_dim" data-config-key="ENFORCE_EMBED_VECTOR_DIM" size="small" label="Enforce Embed Dimension" name="embed_enforce_embed_vector_dim" value="false"><sl-radio value="true">True</sl-radio><sl-radio value="false">False</sl-radio></sl-radio-group></div>
        <div class="section-divider"><hr><span>Parquet Sidecar</span><hr></div>
        <div class="config-field"><sl-radio-group id="embed-use_parquet" data-config-key="USE_PARQUET" size="small" label="Use Parquet Sidecar" name="embed_use_parquet" value="true"><sl-radio value="true">True</sl-radio><sl-radio value="false">False</sl-radio></sl-radio-group></div>
        <div class="config-field"><sl-input id="embed-parquet_filename" data-config-key="PARQUET_FILENAME" label="Parquet Filename" type="text"></sl-input></div>
        <div class="config-field"><sl-select id="embed-parquet_compression" data-config-key="PARQUET_COMPRESSION" label="Parquet Compression"><sl-option value="zstd">zstd</sl-option><sl-option value="snappy">snappy</sl-option><sl-option value="gzip">gzip</sl-option></sl-select></div>
        <div class="config-field"><sl-input id="embed-parquet_row_group_size" data-config-key="PARQUET_ROW_GROUP_SIZE" label="Parquet Row Group Size" type="number" min="1"></sl-input></div>
        <div class="section-divider"><hr><span>Quality &amp; Serialization</span><hr></div>
        <div class="config-field"><sl-input id="embed-embed_batch_size" data-config-key="EMBED_BATCH_SIZE" label="Batch Size" type="number" min="1"></sl-input></div>
        <div class="config-field"><sl-radio-group id="embed-normalize_embeddings" data-config-key="NORMALIZE_EMBEDDINGS" size="small" label="Normalize Embeddings" name="embed_normalize_embeddings" value="true"><sl-radio value="true">True</sl-radio><sl-radio value="false">False</sl-radio></sl-radio-group></div>
        <div class="config-field"><sl-input id="embed-json_indent" data-config-key="JSON_INDENT" label="JSON Indent" type="number" min="0"></sl-input></div>
        <div class="config-field"><sl-radio-group id="embed-strip_embeddings_in_json" data-config-key="STRIP_EMBEDDINGS_IN_JSON" size="small" label="Strip Embeddings in JSON" name="embed_strip_embeddings_in_json" value="true"><sl-radio value="true">True</sl-radio><sl-radio value="false">False</sl-radio></sl-radio-group></div>
        <div class="config-field"><sl-radio-group id="embed-provenance_required" data-config-key="PROVENANCE_REQUIRED" size="small" label="Provenance Required" name="embed_provenance_required" value="true"><sl-radio value="true">True</sl-radio><sl-radio value="false">False</sl-radio></sl-radio-group></div>
        <div class="section-divider"><hr><span>Sampling Controls</span><hr></div>
        <div class="config-field"><sl-input id="embed-max_embed_chunks" data-config-key="MAX_EMBED_CHUNKS" label="Max Embed Chunks (empty = all)" type="number" min="1"></sl-input></div>
        <div class="config-field"><sl-input id="embed-chunk_sample_seed" data-config-key="CHUNK_SAMPLE_SEED" label="Chunk Sample Seed" type="number" min="0"></sl-input></div>
        <div class="config-field"><sl-select id="embed-chunk_sample_mode" data-config-key="CHUNK_SAMPLE_MODE" label="Chunk Sample Mode"><sl-option value="head">head</sl-option><sl-option value="random">random</sl-option></sl-select></div>
        <div class="section-divider"><hr><span>Hardware</span><hr></div>
        <div class="config-field"><sl-input id="embed-device_id" data-config-key="DEVICE_ID" label="CUDA Device ID" type="number" min="0"></sl-input></div>
        <sl-textarea id="embed-status-display" class="config-status-display" label="Notes" placeholder="Configuration notes will appear here" readonly resize="none" rows="3"></sl-textarea>
      </div>
      <div class="config-form-column config-form-column--viewer">
        <div class="config-form-panel-label">File reader</div>
        <div class="fields"><sl-textarea id="embed-config-viewer" class="config-file-viewer" resize="auto" placeholder="Loading file..."></sl-textarea></div>
      </div>
    </div>
  </form>
</section>
