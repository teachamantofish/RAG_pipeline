<section>
  <form id="crawl-pdf-form">
    <div class="config-form-container">
      <div class="config-form-column config-form-column--controls">
        <div class="config-form-panel-label">Crawl PDF configuration</div>
        <div class="config-action-buttons">
          <sl-button variant="primary" id="crawl-pdf-save-btn"><sl-icon name="floppy"></sl-icon></sl-button>
          <sl-button variant="primary" id="crawl-pdf-reload-btn"><sl-icon name="trash"></sl-icon></sl-button>
          <sl-button variant="primary" id="crawl-pdf-run-btn"><sl-icon name="play-fill"></sl-icon></sl-button>
          <sl-button variant="primary" id="crawl-pdf-stop-btn" disabled><sl-icon name="stop-fill"></sl-icon></sl-button>
        </div>
        <div class="config-field"><sl-radio-group id="crawl-pdf-run_docling" data-config-key="RUN_DOCLING" size="small" label="Run Docling" name="crawl_pdf_run_docling" value="true"><sl-radio value="true">True</sl-radio><sl-radio value="false">False</sl-radio></sl-radio-group></div>
        <div class="config-field"><sl-radio-group id="crawl-pdf-run_toc_fixer" data-config-key="RUN_TOC_FIXER" size="small" label="Run TOC Fixer" name="crawl_pdf_run_toc_fixer" value="true"><sl-radio value="true">True</sl-radio><sl-radio value="false">False</sl-radio></sl-radio-group></div>
        <div class="config-field"><sl-radio-group id="crawl-pdf-run_code_fixer" data-config-key="RUN_CODE_FIXER" size="small" label="Run Code Fixer" name="crawl_pdf_run_code_fixer" value="true"><sl-radio value="true">True</sl-radio><sl-radio value="false">False</sl-radio></sl-radio-group></div>
        <div class="config-field"><sl-radio-group id="crawl-pdf-run_pdf_trim" data-config-key="RUN_PDF_TRIM" size="small" label="Run PDF Trim" name="crawl_pdf_run_pdf_trim" value="true"><sl-radio value="true">True</sl-radio><sl-radio value="false">False</sl-radio></sl-radio-group></div>
        <div class="config-field"><sl-input id="crawl-pdf-remove_front" data-config-key="REMOVE_FRONT" label="Remove Front Pages" type="number" min="0"></sl-input></div>
        <div class="config-field"><sl-input id="crawl-pdf-toc_range" data-config-key="TOC_RANGE" label="TOC Range" disabled></sl-input></div>
        <div class="config-field"><sl-input id="crawl-pdf-remove_ranges" data-config-key="REMOVE_RANGES" label="Remove Ranges" disabled></sl-input></div>
        <div class="config-field"><sl-input id="crawl-pdf-remove_back" data-config-key="REMOVE_BACK" label="Remove Back Pages" type="number" min="0"></sl-input></div>
        <sl-textarea id="crawl-pdf-status-display" class="config-status-display" label="Notes" placeholder="Configuration notes will appear here" readonly resize="none" rows="3"></sl-textarea>
      </div>
      <div class="config-form-column config-form-column--viewer">
        <div class="config-form-panel-label">File reader</div>
        <div class="fields"><sl-textarea id="crawl-pdf-config-viewer" class="config-file-viewer" resize="auto" placeholder="Loading file..."></sl-textarea></div>
      </div>
    </div>
  </form>
</section>
