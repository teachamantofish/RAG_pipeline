<section>
  <form>
    <div class="config-form-container">
      <!-- Controls column -->
      <div class="config-form-column config-form-column--controls">
        <div class="config-form-panel-label">Chunk configuration</div>

        <!-- Action buttons -->
        <div class="config-action-buttons">
          <sl-button variant="primary" id="chunk-save-btn">
            <sl-icon name="floppy"></sl-icon>
          </sl-button>
          <sl-button variant="primary" id="chunk-reload-btn">
            <sl-icon name="trash"></sl-icon>
          </sl-button>
          <sl-button variant="primary" id="chunk-run-btn">
            <sl-icon name="play-fill"></sl-icon>
          </sl-button>
          <sl-button variant="primary" id="chunk-stop-btn" disabled><sl-icon name="stop-fill"></sl-icon></sl-button>
        </div>

        <!-- TOKENIZER (read-only expression) -->
        <div class="config-field" id="chunk-tokenizer-field">
          <sl-input id="chunk-tokenizer" data-config-key="TOKENIZER"
            label="Tokenizer" placeholder="cl100k_base" disabled>
          </sl-input>
        </div>

        <!-- MAX_TOKENS_FOR_NODE -->
        <div class="config-field" id="chunk-max-tokens-field">
          <sl-input id="chunk-max_tokens_for_node" data-config-key="MAX_TOKENS_FOR_NODE"
            label="Max Tokens per Node" type="number" min="1">
          </sl-input>
        </div>

        <!-- CHUNK_SIZE_RANGE (read-only derived) -->
        <div class="config-field" id="chunk-size-range-field">
          <sl-input id="chunk-chunk_size_range" data-config-key="CHUNK_SIZE_RANGE"
            label="Chunk Size Range" disabled>
          </sl-input>
        </div>

        <!-- CHUNK_MODEL -->
        <div class="config-field" id="chunk-model-field">
          <sl-select id="chunk-chunk_model" data-config-key="CHUNK_MODEL"
            label="Chunk Model" placeholder="Select a chunk model">
            <sl-option value="">Select a chunk model</sl-option>
            <sl-option value="heading-safe">heading-safe</sl-option>
            <sl-option value="greedy">greedy</sl-option>
            <sl-option value="fixed">fixed</sl-option>
          </sl-select>
        </div>

        <!-- CODE_LENGTH -->
        <div class="config-field" id="chunk-code-length-field">
          <sl-input id="chunk-code_length" data-config-key="CODE_LENGTH"
            label="Code Length (lines)" type="number" min="1" max="50">
          </sl-input>
        </div>

        <!-- KEYWORD_DENSITY -->
        <div class="config-field" id="chunk-keyword-density-field">
          <sl-input id="chunk-keyword_density" data-config-key="KEYWORD_DENSITY"
            label="Keyword Density" type="number" step="0.01" min="0" max="1">
          </sl-input>
        </div>

        <!-- ENABLE_CODE_EXTRACTION -->
        <div class="config-field" id="chunk-code-extraction-field">
          <sl-radio-group id="chunk-enable_code_extraction" data-config-key="ENABLE_CODE_EXTRACTION"
            size="small" label="Enable Code Extraction" name="chunk_enable_code_extraction" value="true">
            <sl-radio value="true">True</sl-radio>
            <sl-radio value="false">False</sl-radio>
          </sl-radio-group>
        </div>

        <!-- OUTPUT_NAME -->
        <div class="config-field" id="chunk-output-name-field">
          <sl-input id="chunk-output_name" data-config-key="OUTPUT_NAME"
            label="Output File Name" placeholder="a_chunks.json">
          </sl-input>
        </div>

        <!-- Status / notes area -->
        <sl-textarea id="chunk-status-display" class="config-status-display"
          label="Notes" placeholder="Configuration notes will appear here"
          readonly resize="none" rows="3">
        </sl-textarea>
      </div>

      <!-- Raw file viewer column -->
      <div class="config-form-column config-form-column--viewer">
        <div class="config-form-panel-label">File reader</div>
        <div class="fields">
          <sl-textarea id="chunk-config-viewer" class="config-file-viewer" resize="auto"
            placeholder="Loading file…">
          </sl-textarea>
        </div>
      </div>
    </div>
  </form>
</section>
