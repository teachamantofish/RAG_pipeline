<section>
  <form id="summary-form">
    <div class="config-form-container">
      <div class="config-form-column config-form-column--controls">
        <div class="config-form-panel-label">Summary configuration</div>
        <div class="config-action-buttons">
          <sl-button variant="primary" id="summary-save-btn"><sl-icon name="floppy"></sl-icon></sl-button>
          <sl-button variant="primary" id="summary-reload-btn"><sl-icon name="trash"></sl-icon></sl-button>
          <sl-button variant="primary" id="summary-run-btn"><sl-icon name="play-fill"></sl-icon></sl-button>
          <sl-button variant="primary" id="summary-stop-btn" disabled><sl-icon name="stop-fill"></sl-icon></sl-button>
        </div>
        <div class="config-field"><sl-input id="summary-chunk_summary_model" data-config-key="CHUNK_SUMMARY_MODEL" label="Chunk Summary Model" type="text"></sl-input></div>
        <div class="config-field"><sl-input id="summary-testingmode" data-config-key="TESTINGMODE" label="Testing Mode (empty = full run)" type="number" min="1"></sl-input></div>
        <div class="config-field"><sl-input id="summary-summary_max_workers" data-config-key="SUMMARY_MAX_WORKERS" label="Max Workers" type="number" min="1"></sl-input></div>
        <div class="config-field"><sl-radio-group id="summary-resume_summaries" data-config-key="RESUME_SUMMARIES" size="small" label="Resume Summaries" name="summary_resume_summaries" value="true"><sl-radio value="true">True</sl-radio><sl-radio value="false">False</sl-radio></sl-radio-group></div>
        <div class="config-field"><sl-input id="summary-summary_flush_every" data-config-key="SUMMARY_FLUSH_EVERY" label="Flush Every N Chunks" type="number" min="1"></sl-input></div>
        <div class="section-divider"><hr><span>Chunk Summary</span><hr></div>
        <div class="config-field"><sl-radio-group id="summary-enable_chunk_summary" data-config-key="ENABLE_CHUNK_SUMMARY" size="small" label="Enable Chunk Summary" name="summary_enable_chunk_summary" value="true"><sl-radio value="true">True</sl-radio><sl-radio value="false">False</sl-radio></sl-radio-group></div>
        <div class="config-field"><sl-input id="summary-chunk_summary_size" data-config-key="CHUNK_SUMMARY_SIZE" label="Chunk Summary Size (tokens)" type="number" min="1"></sl-input></div>
        <div class="config-field"><sl-input id="summary-chunk_summary_prompt_template" data-config-key="CHUNK_SUMMARY_PROMPT_TEMPLATE" label="Chunk Summary Prompt" type="text"></sl-input></div>
        <div class="config-field"><sl-input id="summary-chunk_summary_temperature" data-config-key="CHUNK_SUMMARY_TEMPERATURE" label="Chunk Summary Temperature" type="number" min="0" step="0.1"></sl-input></div>
        <div class="section-divider"><hr><span>Small Chunk Handling</span><hr></div>
        <div class="config-field"><sl-input id="summary-skip_chunk_threshold" data-config-key="SKIP_CHUNK_THRESHOLD" label="Skip Chunk Threshold" type="number" min="0"></sl-input></div>
        <div class="config-field"><sl-input id="summary-pad_chunk_threshold" data-config-key="PAD_CHUNK_THRESHOLD" label="Pad Chunk Threshold" type="number" min="0"></sl-input></div>
        <div class="config-field"><sl-radio-group id="summary-add_concat_header_path" data-config-key="ADD_CONCAT_HEADER_PATH" size="small" label="Add Concat Header Path" name="summary_add_concat_header_path" value="true"><sl-radio value="true">True</sl-radio><sl-radio value="false">False</sl-radio></sl-radio-group></div>
        <div class="config-field"><sl-radio-group id="summary-add_chunk_summary" data-config-key="ADD_CHUNK_SUMMARY" size="small" label="Add Chunk Summary" name="summary_add_chunk_summary" value="true"><sl-radio value="true">True</sl-radio><sl-radio value="false">False</sl-radio></sl-radio-group></div>
        <div class="config-field"><sl-radio-group id="summary-add_page_summary" data-config-key="ADD_PAGE_SUMMARY" size="small" label="Add Page Summary" name="summary_add_page_summary" value="false"><sl-radio value="true">True</sl-radio><sl-radio value="false">False</sl-radio></sl-radio-group></div>
        <div class="section-divider"><hr><span>File / H1 Summary</span><hr></div>
        <div class="config-field"><sl-radio-group id="summary-enable_file_summary" data-config-key="ENABLE_FILE_SUMMARY" size="small" label="Enable File Summary" name="summary_enable_file_summary" value="false"><sl-radio value="true">True</sl-radio><sl-radio value="false">False</sl-radio></sl-radio-group></div>
        <div class="config-field"><sl-input id="summary-file_summary_model" data-config-key="FILE_SUMMARY_MODEL" label="File Summary Model" type="text"></sl-input></div>
        <div class="config-field"><sl-input id="summary-file_summary_size" data-config-key="FILE_SUMMARY_SIZE" label="File Summary Size (tokens)" type="number" min="1"></sl-input></div>
        <div class="config-field"><sl-input id="summary-file_summary_prompt" data-config-key="FILE_SUMMARY_PROMPT" label="File Summary Prompt" disabled></sl-input></div>
        <div class="config-field"><sl-input id="summary-file_summary_temperature" data-config-key="FILE_SUMMARY_TEMPERATURE" label="File Summary Temperature" type="number" min="0" step="0.1"></sl-input></div>
        <div class="section-divider"><hr><span>Summary of Summaries</span><hr></div>
        <div class="config-field"><sl-radio-group id="summary-enable_summary_summary" data-config-key="ENABLE_SUMMARY_SUMMARY" size="small" label="Enable Summary of Summaries" name="summary_enable_summary_summary" value="false"><sl-radio value="true">True</sl-radio><sl-radio value="false">False</sl-radio></sl-radio-group></div>
        <div class="config-field"><sl-input id="summary-child_count" data-config-key="CHILD_COUNT" label="Child Count Threshold" type="number" min="1"></sl-input></div>
        <div class="config-field"><sl-input id="summary-summary_summary_model" data-config-key="SUMMARY_SUMMARY_MODEL" label="Summary-Summary Model" type="text"></sl-input></div>
        <div class="config-field"><sl-input id="summary-summary_summary_size" data-config-key="SUMMARY_SUMMARY_SIZE" label="Summary-Summary Size (tokens)" type="number" min="1"></sl-input></div>
        <div class="config-field"><sl-input id="summary-summary_summary_prompt" data-config-key="SUMMARY_SUMMARY_PROMPT" label="Summary-Summary Prompt" disabled></sl-input></div>
        <div class="config-field"><sl-input id="summary-summary_summary_temperature" data-config-key="SUMMARY_SUMMARY_TEMPERATURE" label="Summary-Summary Temperature" type="number" min="0" step="0.1"></sl-input></div>
        <div class="section-divider"><hr><span>Code Summary</span><hr></div>
        <div class="config-field"><sl-radio-group id="summary-enable_code_summary" data-config-key="ENABLE_CODE_SUMMARY" size="small" label="Enable Code Summary" name="summary_enable_code_summary" value="false"><sl-radio value="true">True</sl-radio><sl-radio value="false">False</sl-radio></sl-radio-group></div>
        <div class="config-field"><sl-input id="summary-code_summary_model" data-config-key="CODE_SUMMARY_MODEL" label="Code Summary Model" type="text"></sl-input></div>
        <div class="config-field"><sl-input id="summary-code_summary_size" data-config-key="CODE_SUMMARY_SIZE" label="Code Summary Size (tokens)" type="number" min="1"></sl-input></div>
        <div class="config-field"><sl-input id="summary-code_summary_prompt" data-config-key="CODE_SUMMARY_PROMPT" label="Code Summary Prompt" disabled></sl-input></div>
        <div class="config-field"><sl-input id="summary-code_summary_temperature" data-config-key="CODE_SUMMARY_TEMPERATURE" label="Code Summary Temperature" type="number" min="0" step="0.1"></sl-input></div>
        <sl-textarea id="summary-status-display" class="config-status-display" label="Notes" placeholder="Configuration notes will appear here" readonly resize="none" rows="3"></sl-textarea>
      </div>
      <div class="config-form-column config-form-column--viewer">
        <div class="config-form-panel-label">File reader</div>
        <div class="fields"><sl-textarea id="summary-config-viewer" class="config-file-viewer" resize="auto" placeholder="Loading file..."></sl-textarea></div>
      </div>
    </div>
  </form>
</section>
